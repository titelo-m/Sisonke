<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Sisonke</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">Sisonke</a>
      <ul class="navbar-links">
        <li><a href="browse.html">Browse Tools</a></li>
        <li><a href="index.html#how-it-works">How it works</a></li>
      </ul>
      <div class="navbar-actions">
        <a href="register.html" class="btn btn-primary btn-sm">Sign up</a>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container" style="max-width: 440px;">
      <div class="card card-flat">
        <h1 class="text-center">Welcome back</h1>
        <p class="text-center text-muted mt-sm mb-lg">Log in to borrow or list your tools.</p>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" required autocomplete="email" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password" />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            Log in
          </button>

          <p class="text-center text-muted mt-md">
            Don't have an account? <a href="register.html">Sign up</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Sisonke. Made in South Africa, for South Africa.</p>
  </footer>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</body>
</html>
